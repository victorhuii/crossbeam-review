name: demo package
on:
  push:
    branches: [main]
    paths: ['deployment.json', 'local_review/scripts/build_demo.py', 'local_review/scripts/check_demo.py', 'local_review/docs/assets/review-state.png', 'web/**', '.github/workflows/demo.yml']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            deployment.json
            local_review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python local_review/scripts/build_demo.py
      - run: python local_review/scripts/check_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: pages-demo
          path: local_review/demo-site
          include-hidden-files: false
